apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Lint and test
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          ruff check .
          pytest -q
      - name: Security scan
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir bandit pip-audit
          echo "=== SAST (bandit) ==="
          bandit -r app/ -ll || true
          echo "=== SCA (pip-audit) ==="
          pip-audit -r requirements.txt || true

      - id: sonar
        name: Scan with SonarQube bundled action
        uses: https://github.com/cloudbees-io/sonarqube-bundled-sast-scan-code@v2.1
        with:
          language: LANGUAGE_PYTHON
          sonar-exclusion: "tests/**,.venv/**"

      # 스캔이 실제로 findings를 만들었는지 대시보드 없이 확인하기 위한 진단 스텝.
      - name: Report scan counts
        uses: docker://alpine:latest
        run: |
          echo "critical  = '${{ steps.sonar.outputs.critical-count }}'"
          echo "very-high = '${{ steps.sonar.outputs.very-high-count }}'"
          echo "high      = '${{ steps.sonar.outputs.high-count }}'"
          echo "medium    = '${{ steps.sonar.outputs.medium-count }}'"
          echo "low       = '${{ steps.sonar.outputs.low-count }}'"
          echo "--- findings가 붙을 asset 매칭 키 ---"
          echo "repositoryUrl = '${{ cloudbees.scm.repositoryUrl }}'"
          echo "branch        = '${{ cloudbees.scm.branch }}'"
          echo "repository    = '${{ cloudbees.scm.repository }}'"
          echo "run_id        = '${{ cloudbees.run_id }}'"

      # Gitleaks는 마켓플레이스에 등재된 시크릿 스캐너이고, asset 등록 단계
      # (generate-references)를 포함한 plugin-chain 구조라 findings가
      # 컴포넌트에 제대로 붙는다. 마켓플레이스에서 Gitleaks 활성화 필요.
      - id: gitleaks
        name: Secret scan with Gitleaks
        uses: https://github.com/cloudbees-io/gitleaks-plugin@v1.0.7

      - name: Report Gitleaks counts
        uses: docker://alpine:latest
        run: |
          echo "critical  = '${{ steps.gitleaks.outputs.critical-count }}'"
          echo "very-high = '${{ steps.gitleaks.outputs.very-high-count }}'"
          echo "high      = '${{ steps.gitleaks.outputs.high-count }}'"
          echo "medium    = '${{ steps.gitleaks.outputs.medium-count }}'"
          echo "low       = '${{ steps.gitleaks.outputs.low-count }}'"

  # 이미지 빌드 → GHCR push → artifact 등록 → 바이너리(컨테이너) 스캔.
  # kaniko가 빌드와 동시에 artifact version을 등록한다(artifact-ids 출력).
  # trivy-plugin은 레지스트리가 아니라 kaniko가 뽑아준 tar를 스캔한다.
  build:
    needs: test
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      - id: dockerconfig
        name: Configure container registry credentials
        uses: cloudbees-io/configure-oci-credentials@v1
        with:
          registry: ghcr.io
          username: iHyunWoo
          password: ${{ secrets.GH_TOKEN }}

      - id: image
        name: Build and push image
        uses: cloudbees-io/kaniko@v1
        with:
          context: .
          dockerfile: Dockerfile
          destination: ghcr.io/ihyunwoo/cloudbee-test:${{ cloudbees.run_id }},ghcr.io/ihyunwoo/cloudbee-test:latest
          tar-path: image.tar

      - id: trivy
        name: Scan image with Trivy
        uses: https://github.com/cloudbees-io/trivy-plugin@v2.0.6
        with:
          binary-tar-path: image.tar

      - name: Report build and scan results
        uses: docker://alpine:latest
        run: |
          echo "image        = '${{ steps.image.outputs.image }}'"
          echo "digest       = '${{ steps.image.outputs.digest }}'"
          echo "artifact-ids = '${{ steps.image.outputs.artifact-ids }}'"
          echo "--- Trivy ---"
          echo "critical  = '${{ steps.trivy.outputs.critical-count }}'"
          echo "very-high = '${{ steps.trivy.outputs.very-high-count }}'"
          echo "high      = '${{ steps.trivy.outputs.high-count }}'"
          echo "medium    = '${{ steps.trivy.outputs.medium-count }}'"
          echo "low       = '${{ steps.trivy.outputs.low-count }}'"
