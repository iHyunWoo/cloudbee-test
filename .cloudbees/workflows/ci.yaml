apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Lint and test
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          ruff check .
          pytest -q
      - name: Security scan
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir bandit pip-audit
          rc=0
          echo "=== SAST (bandit) ==="
          bandit -r app/ -ll || rc=1
          echo "=== SCA (pip-audit) ==="
          pip-audit -r requirements.txt || rc=1
          exit $rc
