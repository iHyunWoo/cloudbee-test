apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      # 시크릿이 워크플로우까지 도달하는지 확인한다. 값은 찍지 않고 길이만 본다.
      - name: Check secrets
        uses: docker://alpine:latest
        env:
          ST: ${{ secrets.SMART_TESTS_TOKEN }}
          GH: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -n "$ST" ]; then echo "SMART_TESTS_TOKEN: 있음 (${#ST}자)"; else echo "SMART_TESTS_TOKEN: 비어 있음"; fi
          if [ -n "$GH" ]; then echo "GH_TOKEN: 있음 (${#GH}자)"; else echo "GH_TOKEN: 비어 있음"; fi

      - name: Lint and test
        # slim 이 아닌 이유: smart-tests 가 git 바이너리를 호출한다
        #   (--no-commit-collection 을 줘도 마찬가지).
        # 3.13 인 이유: smart-tests-cli 가 requires_python >=3.13.
        uses: docker://python:3.13
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          # PyPI 패키지 이름은 smart-tests-cli 이고, 실행 파일 이름이 smart-tests 다.
          pip install --no-cache-dir -r requirements-dev.txt smart-tests-cli
          ruff check .

          # build -> session -> tests 순서로 기록해야 연결된다.
          # session ID는 record session 이 표준출력으로 돌려주므로 파일에 받아
          # --session @file 로 넘긴다. 이름을 지어내면 안 된다.
          # 토큰이 없으면 전송을 건너뛰고 테스트만 돌린다.
          BUILD="run-${{ cloudbees.run_id }}"
          if [ -n "$SMART_TESTS_TOKEN" ]; then
            # Predictive Test Selection은 "어떤 코드가 바뀌었나"를 알아야 하므로
            # 커밋 데이터를 수집한다. shallow clone 등으로 실패하면 커밋 없이 재시도.
            smart-tests record build --build "$BUILD" \
              || smart-tests record build --build "$BUILD" --no-commit-collection

            # observation 모드: subset을 계산만 하고 테스트는 전부 실행한다.
            # "subset만 돌렸다면 이 실패를 놓쳤을까"를 사후 비교하는 단계.
            smart-tests record session --build "$BUILD" \
              --test-suite pytest --observation > session.txt

            # subset을 호출해야 무엇을 골랐을지가 기록된다.
            # observation 모드이므로 이 결과로 테스트를 거르지는 않는다.
            smart-tests subset --session @session.txt --target 50% pytest tests \
              > subset.txt || true
          fi

          # 정상 스위트: 실패하면 CI를 세운다.
          rc=0
          pytest tests -q --ignore=tests/flaky --junitxml=report.xml || rc=$?

          # flaky 스위트: 실행마다 결과가 달라지므로 CI 판정에서 제외한다.
          # 결과는 Smart Tests 로 보내야 불건전 테스트로 집계된다.
          pytest tests/flaky -q --junitxml=report-flaky.xml || true

          if [ -n "$SMART_TESTS_TOKEN" ]; then
            smart-tests record tests --session @session.txt pytest \
              report.xml report-flaky.xml || true
          fi
          exit $rc

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2.0.7
        with:
          test-type: junit
          results-path: report*.xml
      - name: Security scan
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir bandit pip-audit
          echo "=== SAST (bandit) ==="
          bandit -r app/ -ll || true
          echo "=== SCA (pip-audit) ==="
          pip-audit -r requirements.txt || true

      - id: sonar
        name: Scan with SonarQube bundled action
        uses: https://github.com/cloudbees-io/sonarqube-bundled-sast-scan-code@v2.1
        with:
          language: LANGUAGE_PYTHON
          sonar-exclusion: "tests/**,.venv/**"

      # 스캔이 실제로 findings를 만들었는지 대시보드 없이 확인하기 위한 진단 스텝.
      - name: Report scan counts
        uses: docker://alpine:latest
        run: |
          echo "critical  = '${{ steps.sonar.outputs.critical-count }}'"
          echo "very-high = '${{ steps.sonar.outputs.very-high-count }}'"
          echo "high      = '${{ steps.sonar.outputs.high-count }}'"
          echo "medium    = '${{ steps.sonar.outputs.medium-count }}'"
          echo "low       = '${{ steps.sonar.outputs.low-count }}'"
          echo "--- findings가 붙을 asset 매칭 키 ---"
          echo "repositoryUrl = '${{ cloudbees.scm.repositoryUrl }}'"
          echo "branch        = '${{ cloudbees.scm.branch }}'"
          echo "repository    = '${{ cloudbees.scm.repository }}'"
          echo "run_id        = '${{ cloudbees.run_id }}'"

      # Gitleaks는 마켓플레이스에 등재된 시크릿 스캐너이고, asset 등록 단계
      # (generate-references)를 포함한 plugin-chain 구조라 findings가
      # 컴포넌트에 제대로 붙는다. 마켓플레이스에서 Gitleaks 활성화 필요.
      - id: gitleaks
        name: Secret scan with Gitleaks
        uses: https://github.com/cloudbees-io/gitleaks-plugin@v1.0.7

      - name: Report Gitleaks counts
        uses: docker://alpine:latest
        run: |
          echo "critical  = '${{ steps.gitleaks.outputs.critical-count }}'"
          echo "very-high = '${{ steps.gitleaks.outputs.very-high-count }}'"
          echo "high      = '${{ steps.gitleaks.outputs.high-count }}'"
          echo "medium    = '${{ steps.gitleaks.outputs.medium-count }}'"
          echo "low       = '${{ steps.gitleaks.outputs.low-count }}'"

  # 이미지 빌드 → GHCR push → artifact 등록 → 바이너리(컨테이너) 스캔.
  # kaniko가 빌드와 동시에 artifact version을 등록한다(artifact-ids 출력).
  # trivy-plugin은 레지스트리가 아니라 kaniko가 뽑아준 tar를 스캔한다.
  build:
    needs: test
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      - id: dockerconfig
        name: Configure container registry credentials
        uses: cloudbees-io/configure-oci-credentials@v1
        with:
          registry: ghcr.io
          username: iHyunWoo
          password: ${{ secrets.GH_TOKEN }}

      - id: image
        name: Build and push image
        # kind: build 는 DORA 지표가 이 스텝을 빌드로 집계하게 한다.
        # DORA는 build와 deploy 스텝이 모두 있어야 계산된다.
        kind: build
        uses: cloudbees-io/kaniko@v1
        with:
          context: .
          dockerfile: Dockerfile
          destination: ghcr.io/ihyunwoo/cloudbee-test:${{ cloudbees.run_id }},ghcr.io/ihyunwoo/cloudbee-test:latest
          tar-path: image.tar

      - id: trivy
        name: Scan image with Trivy
        uses: https://github.com/cloudbees-io/trivy-plugin@v2.0.6
        with:
          binary-tar-path: image.tar

      - name: Report build and scan results
        uses: docker://alpine:latest
        run: |
          echo "image        = '${{ steps.image.outputs.image }}'"
          echo "digest       = '${{ steps.image.outputs.digest }}'"
          echo "artifact-ids = '${{ steps.image.outputs.artifact-ids }}'"
          echo "--- Trivy ---"
          echo "critical  = '${{ steps.trivy.outputs.critical-count }}'"
          echo "very-high = '${{ steps.trivy.outputs.very-high-count }}'"
          echo "high      = '${{ steps.trivy.outputs.high-count }}'"
          echo "medium    = '${{ steps.trivy.outputs.medium-count }}'"
          echo "low       = '${{ steps.trivy.outputs.low-count }}'"

  # DORA는 component 단위로 계산되므로 build와 deploy 스텝이 이 워크플로우
  # 안에 함께 있어야 한다. 실제 릴리스 배포는 Application 레포의
  # deployer.yaml 이 담당하고, 이 job 은 DORA 집계용 배포 기록이다.
  deploy:
    needs: build
    environment: staging
    steps:
      - name: Deploy
        kind: deploy
        uses: docker://alpine:latest
        run: |
          echo "deployed to staging (run ${{ cloudbees.run_id }})"
