apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1
      - name: Lint and test
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          ruff check .
          pytest -q
      - name: Security scan
        uses: docker://python:3.12-slim
        run: |
          pip install --no-cache-dir bandit pip-audit
          echo "=== SAST (bandit) ==="
          bandit -r app/ -ll || true
          echo "=== SCA (pip-audit) ==="
          pip-audit -r requirements.txt || true

      - id: sonar
        name: Scan with SonarQube bundled action
        uses: https://github.com/cloudbees-io/sonarqube-bundled-sast-scan-code@v2.1
        with:
          language: LANGUAGE_PYTHON
          sonar-exclusion: "tests/**,.venv/**"

      # 스캔이 실제로 findings를 만들었는지 대시보드 없이 확인하기 위한 진단 스텝.
      - name: Report scan counts
        uses: docker://alpine:latest
        run: |
          echo "critical  = '${{ steps.sonar.outputs.critical-count }}'"
          echo "very-high = '${{ steps.sonar.outputs.very-high-count }}'"
          echo "high      = '${{ steps.sonar.outputs.high-count }}'"
          echo "medium    = '${{ steps.sonar.outputs.medium-count }}'"
          echo "low       = '${{ steps.sonar.outputs.low-count }}'"
          echo "--- findings가 붙을 asset 매칭 키 ---"
          echo "repositoryUrl = '${{ cloudbees.scm.repositoryUrl }}'"
          echo "branch        = '${{ cloudbees.scm.branch }}'"
          echo "repository    = '${{ cloudbees.scm.repository }}'"
          echo "run_id        = '${{ cloudbees.run_id }}'"
