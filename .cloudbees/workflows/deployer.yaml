apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deployer

# staged 워크플로우가 각 스테이지마다 호출한다.
# manifest는 "어느 component의 어느 artifact version을 배포할지" 담은 JSON.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      manifest:
        type: string
        required: true

jobs:
  deploy:
    steps:
      # 실제 배포 대상이 없으므로 무엇을 배포할지 출력만 한다.
      # 진짜 배포로 바꾸려면 이 스텝을 kubectl/helm 등으로 교체하면 된다.
      - name: Show deployment plan
        uses: docker://alpine:latest
        run: |
          echo "environment = ${{ inputs.environment }}"
          echo "manifest    = ${{ inputs.manifest }}"
