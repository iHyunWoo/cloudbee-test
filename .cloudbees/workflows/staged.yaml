apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: staged

# 릴리스가 이 워크플로우를 실행한다. 스테이지 1개(staging)만 둔 최소 구성.
# 스테이지를 늘리려면 job을 추가하고 environment만 바꾸면 된다.
on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true

jobs:
  staging:
    environment: staging
    uses: ./.cloudbees/workflows/deployer.yaml
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
