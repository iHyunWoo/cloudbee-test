[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudbee-test"
version = "0.1.0"
description = "Sample FastAPI app for CloudBees workflow testing"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic>=2.12.0",
    "jinja2==3.1.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smart Tests는 JUnit XML의 file 속성으로 test path를 만든다.
# 기본값 xunit2 는 그 속성을 빼므로 test path 데이터가 비게 된다.
junit_family = "xunit1"
